<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner Pro - Jeux vidéo</title>
<style>
:root{--bg:#121212;--card:#1e1e1e;--accent:#00adb5;--secondary:#f0a500;--text:#eee;--error:#ff4d4d;--success:#2e7d32}
*{box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:15px;display:flex;flex-direction:column;align-items:center}
.container{width:100%;max-width:500px;background:var(--card);border-radius:12px;padding:20px;box-shadow:0 4px 15px rgba(0,0,0,.5)}
h1,h2{text-align:center;color:var(--accent);margin-top:0}
h1{font-size:1.4rem}h2{font-size:1.2rem}
.section{border-top:2px solid #333;padding-top:15px;margin-top:15px}
.preview-box{width:100%;height:250px;border:2px dashed #444;border-radius:8px;display:flex;justify-content:center;align-items:center;overflow:hidden;background:#0a0a0a;margin-bottom:15px}
.preview-box img{max-width:100%;max-height:100%;object-fit:contain;display:none}
#placeholder-text{color:#666}
.btn{display:block;width:100%;padding:14px;font-size:1rem;font-weight:bold;color:#fff;border:none;border-radius:8px;cursor:pointer;margin-bottom:12px}
.btn-camera{background:var(--accent)}
.btn-gallery{background:var(--secondary)}
.btn-analyze{background:#00b0ff}
.btn-confirm{background:var(--accent);margin-bottom:0}
.btn-small{background:#333;padding:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=file]{display:none}
input[type=password],input[type=text]{width:100%;padding:11px;border-radius:8px;border:1px solid #444;background:#0a0a0a;color:var(--text);margin-bottom:10px;font-size:1rem}
label{font-size:.85rem;color:#aaa;display:block;margin-bottom:3px}
.verification-zone{margin-top:20px;padding:15px;background:#252525;border-radius:8px;display:none}
.verification-zone h3{margin-top:0;color:var(--secondary)}
.gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin:15px 0}
.gallery-item{position:relative;border:2px solid #444;border-radius:6px;background:#000;cursor:pointer;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
.gallery-item img{max-width:90%;max-height:100px;object-fit:contain}
.gallery-item .noimg{height:100px;display:flex;align-items:center;color:#666;font-size:.8rem}
.gallery-item span{font-size:.75rem;text-align:center;margin-top:6px;width:100%}
.gallery-item small{color:#aaa;font-size:.7rem}
.gallery-item input{position:absolute;top:5px;left:5px;width:18px;height:18px;accent-color:var(--accent)}
.gallery-item.selected{border-color:var(--accent);box-shadow:0 0 8px var(--accent)}
.result-box{margin-top:15px;padding:15px;border-radius:8px;background:var(--success);display:none;font-weight:bold;line-height:1.4}
.error-box{margin-top:15px;padding:15px;border-radius:8px;background:#2c1a1a;border:1px solid var(--error);color:var(--error);display:none;font-family:monospace;white-space:pre-wrap}
.loader{display:none;text-align:center;margin:15px 0;font-weight:bold;color:var(--accent)}
.inventory-list{list-style:none;padding:0;margin:15px 0 0}
.inventory-item{background:#252525;margin-bottom:10px;padding:10px;border-radius:6px;display:flex;align-items:center;gap:10px}
.inventory-item img,.inventory-item .ph{width:50px;height:50px;object-fit:contain;background:#000;border-radius:4px;flex:none}
.inventory-item div{flex:1}
.inventory-item small{color:#aaa;display:block}
.inventory-item button{background:none;border:1px solid #555;color:var(--error);border-radius:6px;padding:6px 10px;cursor:pointer}
</style>
</head>
<body>
<div class="container">
  <h1>Scanner Pro - Jeux vidéo</h1>

  <div class="section">
    <h2>Scanner un jeu</h2>
    <div class="preview-box">
      <span id="placeholder-text">Aucun scan en cours</span>
      <img id="image-preview" alt="Aperçu">
    </div>
    <input type="file" id="hidden-input-cam" accept="image/*" capture="environment">
    <input type="file" id="hidden-input-file" accept="image/*">
    <button class="btn btn-camera" id="btn-cam">📸 Prendre une photo</button>
    <button class="btn btn-gallery" id="btn-gal">📁 Choisir depuis la galerie</button>
    <button class="btn btn-analyze" id="btn-submit" disabled>🔍 Identifier le jeu</button>
  </div>

  <div class="loader" id="loading-spinner">Analyse IA en cours...</div>

  <div class="verification-zone" id="v-zone">
    <h3>Correspondances trouvées :</h3>
    <p style="font-size:.9rem;color:#aaa;margin:0">Cochez la bonne proposition :</p>
    <div class="gallery-grid" id="v-gallery"></div>
    <button class="btn btn-confirm" id="btn-confirm">✅ Confirmer et ajouter à l'inventaire</button>
  </div>

  <div class="result-box" id="output-success"></div>
  <div class="error-box" id="output-error"></div>

  <div class="section">
    <h2>Mon inventaire <span id="count" style="color:#aaa;font-weight:400"></span></h2>
    <ul class="inventory-list" id="inventory-list"></ul>
  </div>

  <div class="section">
    <h2>Clés API</h2>
    <label for="geminiKey">Clé Google Gemini (aistudio.google.com/apikey)</label>
    <input type="password" id="geminiKey" autocomplete="off" placeholder="AIza...">
    <label for="rawgKey">Clé RAWG, facultative, pour les jaquettes (rawg.io/apidocs)</label>
    <input type="text" id="rawgKey" autocomplete="off" placeholder="Collez votre clé">
    <button class="btn btn-small" id="btn-keys">Enregistrer les clés</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MODELS = ["gemini-2.5-flash", "gemini-3.5-flash", "gemini-3.1-flash-lite"];

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

let activeBase64 = null, activeMime = "image/jpeg", proposals = [];
let inventory = [];
try { inventory = JSON.parse(store("gameInventory")) || []; } catch (e) { inventory = []; }

$("geminiKey").value = store("gemini_key") || "";
$("rawgKey").value = store("rawg_key") || "";
$("btn-keys").addEventListener("click", () => {
  store("gemini_key", $("geminiKey").value.trim());
  store("rawg_key", $("rawgKey").value.trim());
  alert("Clés enregistrées sur cet appareil.");
});

function showError(msg) { const b = $("output-error"); b.textContent = "❌ " + msg; b.style.display = "block"; }
function resetBoxes() { $("v-zone").style.display = "none"; $("output-success").style.display = "none"; $("output-error").style.display = "none"; }

function renderInventory() {
  const ul = $("inventory-list");
  ul.innerHTML = inventory.map((g, i) => `
    <li class="inventory-item">
      ${g.image_url ? `<img src="${esc(g.image_url)}" alt="jaquette" referrerpolicy="no-referrer">` : `<div class="ph"></div>`}
      <div><strong>${esc(g.titre)}</strong><small>${esc(g.console || "")}</small></div>
      <button data-del="${i}" aria-label="Supprimer">Suppr.</button>
    </li>`).join("");
  $("count").textContent = inventory.length ? "(" + inventory.length + ")" : "";
}
$("inventory-list").addEventListener("click", e => {
  const b = e.target.closest("[data-del]"); if (!b) return;
  const g = inventory[b.dataset.del];
  if (g && confirm("Supprimer « " + g.titre + " » ?")) {
    inventory.splice(b.dataset.del, 1);
    store("gameInventory", JSON.stringify(inventory));
    renderInventory();
  }
});

/* Photo : redimensionnée pour limiter le poids envoyé à l'API */
function processFile(files) {
  const file = files && files[0]; if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const data = c.toDataURL("image/jpeg", 0.85);
    activeMime = "image/jpeg";
    activeBase64 = data.split(",")[1];
    $("image-preview").src = data;
    $("image-preview").style.display = "block";
    $("placeholder-text").style.display = "none";
    $("btn-submit").disabled = false;
    resetBoxes();
    URL.revokeObjectURL(url);
  };
  img.onerror = () => showError("Image illisible.");
  img.src = url;
}
$("btn-cam").addEventListener("click", () => $("hidden-input-cam").click());
$("btn-gal").addEventListener("click", () => $("hidden-input-file").click());
["hidden-input-cam", "hidden-input-file"].forEach(id => $(id).addEventListener("change", e => { processFile(e.target.files); e.target.value = ""; }));

async function askGemini() {
  const key = (store("gemini_key") || "").trim();
  if (!key) throw new Error("Ajoutez d'abord votre clé Gemini (section Clés API).");
  const prompt = 'Cette photo montre un jeu vidéo (jaquette, tranche ou dos). Identifie-le. Réponds UNIQUEMENT en JSON strict : {"propositions":[{"titre":"titre officiel complet","console":"support (PS5, PS4, Switch, Xbox...)"}]}. Donne 1 à 3 propositions, de la plus probable à la moins probable. N\'invente rien.';
  let lastErr;
  for (const m of MODELS) {
    const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + m + ":generateContent", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify({
        contents: [{ parts: [{ inline_data: { mime_type: activeMime, data: activeBase64 } }, { text: prompt }] }],
        generationConfig: { responseMimeType: "application/json", temperature: 0 }
      })
    });
    if ([404, 429, 500, 502, 503, 504].includes(r.status)) {
      lastErr = new Error(r.status === 429 ? "Quota atteint (429)." : r.status === 404 ? "Modèle " + m + " introuvable." : "Gemini surchargé (" + r.status + ").");
      await new Promise(ok => setTimeout(ok, 800));
      continue;
    }
    const d = await r.json();
    if (!r.ok) throw new Error("Erreur (" + r.status + ") : " + ((d.error && d.error.message) || "inconnue"));
    const parts = (((d.candidates || [])[0] || {}).content || {}).parts || [];
    const txt = parts.map(p => p.text || "").join("");
    const mm = txt.match(/\{[\s\S]*\}/);
    if (!mm) throw new Error("Réponse IA illisible.");
    const list = (JSON.parse(mm[0]).propositions || []).filter(p => p && p.titre);
    if (!list.length) throw new Error("Aucun jeu reconnu. Essayez une photo plus nette.");
    return list.slice(0, 3);
  }
  throw lastErr || new Error("Aucun modèle disponible.");
}

async function fetchCover(titre) {
  const k = (store("rawg_key") || "").trim();
  if (!k) return null;
  try {
    const r = await fetch("https://api.rawg.io/api/games?key=" + encodeURIComponent(k) + "&search=" + encodeURIComponent(titre) + "&search_precise=true&page_size=1");
    if (!r.ok) return null;
    const d = await r.json();
    return (d.results && d.results[0] && d.results[0].background_image) || null;
  } catch (e) { return null; }
}

$("btn-submit").addEventListener("click", async () => {
  if (!activeBase64) return;
  resetBoxes();
  $("loading-spinner").style.display = "block";
  $("btn-submit").disabled = true;
  try {
    const list = await askGemini();
    const covers = await Promise.all(list.map(p => fetchCover(p.titre)));
    proposals = list.map((p, i) => ({ titre: p.titre, console: p.console || "", image_url: covers[i] }));
    $("v-gallery").innerHTML = proposals.map((p, i) => `
      <div class="gallery-item ${i === 0 ? "selected" : ""}" data-i="${i}">
        <input type="radio" name="game-choice" value="${i}" ${i === 0 ? "checked" : ""}>
        ${p.image_url ? `<img src="${esc(p.image_url)}" alt="jaquette" referrerpolicy="no-referrer">` : `<div class="noimg">Pas d'image</div>`}
        <span>${esc(p.titre)}</span><small>${esc(p.console)}</small>
      </div>`).join("");
    $("v-zone").style.display = "block";
  } catch (err) {
    showError(err.message);
  } finally {
    $("loading-spinner").style.display = "none";
    $("btn-submit").disabled = false;
  }
});

$("v-gallery").addEventListener("click", e => {
  const item = e.target.closest(".gallery-item"); if (!item) return;
  document.querySelectorAll(".gallery-item").forEach(el => el.classList.remove("selected"));
  item.classList.add("selected");
  item.querySelector("input").checked = true;
});

$("btn-confirm").addEventListener("click", () => {
  const sel = document.querySelector('input[name="game-choice"]:checked');
  if (!sel) return;
  const game = proposals[sel.value];
  inventory.push(game);
  store("gameInventory", JSON.stringify(inventory));
  renderInventory();
  $("v-zone").style.display = "none";
  $("output-success").innerHTML = "🎯 Jeu ajouté à l'inventaire :<br>📁 " + esc(game.titre);
  $("output-success").style.display = "block";
});

renderInventory();
</script>
</body>
</html>
