<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prix Jeux – Scanner & catalogue</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{--bg:#eef0f3;--card:#fff;--ink:#16213a;--mute:#5d6678;--line:#d5d9e1;--accent:#2b4acb;--price:#0a8f4a;--bad:#c0392b;--r:10px}
@media (prefers-color-scheme:dark){:root{--bg:#10141f;--card:#1a2030;--ink:#e8ecf5;--mute:#98a2b8;--line:#2c3550;--accent:#7f98ff;--price:#3ddc84;--bad:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;display:grid;gap:14px}
h1{font-size:1.5rem;margin:4px 0 0;letter-spacing:-.02em}
h2{font-size:1.05rem;margin:0 0 10px}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
button,select,input{font:inherit;color:inherit}
button{border:0;border-radius:var(--r);padding:12px 14px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;width:100%}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);margin-bottom:10px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#cam{display:none;margin-top:12px;position:relative;border-radius:var(--r);overflow:hidden;background:#000}
#cam video{width:100%;display:block;max-height:300px;object-fit:cover}
#cam::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:#ff3b30;box-shadow:0 0 8px #ff3b30;pointer-events:none}
#cam video{cursor:crosshair;touch-action:manipulation}
#ring{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border:2px solid #ffd60a;border-radius:50%;pointer-events:none;opacity:0}
#ring.on{animation:ring .9s ease-out}
@keyframes ring{0%{opacity:1;transform:scale(1.6)}40%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#ring.on{animation:none;opacity:1}}
#camTools{display:none;margin-top:10px;grid-template-columns:1fr auto;gap:10px;align-items:start}
#camTools select{margin:0}
#camTools button{width:auto}
#hint{display:none;margin:8px 0 0;font-size:.85rem;color:var(--mute)}
#result{margin-top:12px;display:none;padding:12px;border-radius:var(--r);border:1px solid var(--line)}
#result .name{font-weight:700}
#result .price{color:var(--price);font-size:1.8rem;font-weight:800}
#result.unknown{border-color:var(--bad)}
#result.unknown .name{color:var(--bad)}
details{border-top:1px solid var(--line)}
details:first-of-type{border-top:0}
summary{padding:12px 2px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between}
summary span{color:var(--mute);font-weight:400}
.game{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 2px;border-top:1px dashed var(--line)}
.game small{display:block;color:var(--mute)}
.game b{color:var(--price)}
.game button{width:auto;padding:6px 10px;background:transparent;color:var(--bad);border:1px solid var(--line)}
.empty{color:var(--mute);margin:0}
#toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;display:none;font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>Prix Jeux</h1>

  <section>
    <h2>Scanner un code-barres</h2>
    <button id="scanBtn" type="button">Activer la caméra</button>
    <div id="cam"><video id="video" playsinline muted autoplay webkit-playsinline></video><div id="ring"></div></div>
    <div id="camTools">
      <select id="camSelect" aria-label="Choisir la caméra"></select>
      <button id="camSwitch" type="button" class="alt">Changer</button>
    </div>
    <p id="hint">Touchez l'image pour faire la mise au point.</p>
    <div id="result" role="status" aria-live="polite"></div>
  </section>

  <section>
    <h2>Ajouter ou modifier un jeu</h2>
    <label for="fName">Nom du jeu</label>
    <input id="fName" autocomplete="off" placeholder="Ex. Zelda : Tears of the Kingdom">
    <label for="fCode">Code-barres</label>
    <input id="fCode" inputmode="numeric" autocomplete="off" placeholder="Scannez ou collez le code">
    <div class="row">
      <div><label for="fConsole">Support</label>
        <select id="fConsole">
          <option>PS5</option><option>PS4</option><option>Switch</option><option>Xbox Series</option>
          <option>Xbox One</option><option>Wii</option><option>PC</option><option>Rétro</option><option>Autre</option>
        </select></div>
      <div><label for="fPrice">Prix (€)</label>
        <input id="fPrice" inputmode="decimal" placeholder="29,90"></div>
    </div>
    <button id="saveBtn" type="button">Enregistrer le jeu</button>
  </section>

  <section>
    <h2>Catalogue <span id="count" style="color:var(--mute);font-weight:400"></span></h2>
    <div id="list"></div>
  </section>

  <section>
    <h2>Sauvegarde</h2>
    <div class="row">
      <button id="exportBtn" type="button" class="alt">Exporter (.json)</button>
      <button id="importBtn" type="button" class="alt">Importer</button>
    </div>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
  </section>
</main>
<div id="toast"></div>

<script>
const KEY = "catalogue_jeux_v1";
let games = {}; // { code: {name, code, console, price} }

function load(){ try{ games = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ games = {}; } }
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(games)); }catch(e){ toast("Stockage local indisponible : pensez à exporter."); } }
const $ = id => document.getElementById(id);
const eur = n => Number(n).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tt; function toast(m){ const t=$("toast"); t.textContent=m; t.style.display="block"; clearTimeout(tt); tt=setTimeout(()=>t.style.display="none",2600); }

/* ---------- Scanner ---------- */
let reader = null, scanning = false, cams = [], noFocusWarned = false;
const PREF = "camera_pref";
function getPref(){ try{ return localStorage.getItem(PREF); }catch(e){ return null; } }
function setPref(id){ try{ localStorage.setItem(PREF,id); }catch(e){} }

function stopScan(){
  if(reader){ try{ reader.reset(); }catch(e){} reader = null; }
  const v = $("video");
  if(v.srcObject){ v.srcObject.getTracks().forEach(t=>t.stop()); v.srcObject = null; }
  $("cam").style.display = "none";
  $("camTools").style.display = "none";
  $("hint").style.display = "none";
  $("scanBtn").textContent = "Activer la caméra";
  scanning = false;
}

function track(){ const s = $("video").srcObject; return s && s.getVideoTracks()[0]; }

async function listCameras(){
  try{
    const all = await navigator.mediaDevices.enumerateDevices();
    cams = all.filter(d=>d.kind==="videoinput");
  }catch(e){ cams = []; }
  const sel = $("camSelect"), cur = track() && track().getSettings().deviceId;
  sel.innerHTML = cams.map((c,i)=>`<option value="${esc(c.deviceId)}">${esc(c.label || "Caméra "+(i+1))}</option>`).join("");
  if(cur) sel.value = cur;
  $("camSwitch").style.display = cams.length > 1 ? "" : "none";
  sel.style.display = cams.length > 1 ? "" : "none";
}

async function startScan(deviceId){
  if(!window.ZXing){ toast("Bibliothèque de scan non chargée. Vérifiez la connexion."); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast("Caméra indisponible (page en HTTPS requise)."); return; }
  const v = $("video");
  v.setAttribute("playsinline",""); v.muted = true;
  $("cam").style.display = "block";
  $("scanBtn").textContent = "Couper la caméra";
  scanning = true;
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
  reader = new ZXing.BrowserMultiFormatReader(hints, 300);
  const id = deviceId || getPref();
  const base = {width:{ideal:1280},height:{ideal:720}};
  const tryStart = async (video)=>reader.decodeFromConstraints({video:{...base,...video}}, v,
      (res)=>{ if(res && scanning){ const code = res.getText(); stopScan(); onCode(code); } });
  try{
    try{ await tryStart(id ? {deviceId:{exact:id}} : {facingMode:{ideal:"environment"}}); }
    catch(err){
      if(id && err && (err.name==="OverconstrainedError"||err.name==="NotFoundError")){ reader.reset(); reader = new ZXing.BrowserMultiFormatReader(hints,300); await tryStart({facingMode:{ideal:"environment"}}); }
      else throw err;
    }
    const t = track();
    if(t){ const cur = t.getSettings().deviceId; if(cur) setPref(cur); }
    await listCameras();          // les noms des caméras n'apparaissent qu'après l'autorisation
    $("camTools").style.display = "grid";
    $("hint").style.display = "block";
  }catch(e){
    stopScan();
    toast(e && e.name==="NotAllowedError" ? "Accès à la caméra refusé." : "Impossible d'ouvrir la caméra.");
  }
}

function switchTo(id){ stopScan(); startScan(id); }
$("scanBtn").addEventListener("click",()=>scanning?stopScan():startScan());
$("camSelect").addEventListener("change",e=>switchTo(e.target.value));
$("camSwitch").addEventListener("click",()=>{
  if(cams.length < 2) return;
  const cur = $("camSelect").value, i = cams.findIndex(c=>c.deviceId===cur);
  switchTo(cams[(i+1)%cams.length].deviceId);
});

/* Mise au point au toucher */
$("video").addEventListener("click", async e=>{
  const v = $("video"), r = v.getBoundingClientRect(), t = track();
  if(!t || !v.videoWidth) return;
  const ring = $("ring"), cr = $("cam").getBoundingClientRect();
  ring.style.left = (e.clientX-cr.left)+"px"; ring.style.top = (e.clientY-cr.top)+"px";
  ring.classList.remove("on"); void ring.offsetWidth; ring.classList.add("on");

  const sc = Math.max(r.width/v.videoWidth, r.height/v.videoHeight);
  const offX = (v.videoWidth*sc - r.width)/2, offY = (v.videoHeight*sc - r.height)/2;
  const x = Math.min(1,Math.max(0,(e.clientX-r.left+offX)/(v.videoWidth*sc)));
  const y = Math.min(1,Math.max(0,(e.clientY-r.top+offY)/(v.videoHeight*sc)));

  const caps = (t.getCapabilities && t.getCapabilities()) || {};
  const modes = caps.focusMode || [];
  if(!modes.length){
    if(!noFocusWarned){ noFocusWarned = true; toast("Cet appareil gère la mise au point automatiquement."); }
    return;
  }
  const mode = modes.includes("single-shot") ? "single-shot" : (modes.includes("continuous") ? "continuous" : modes[0]);
  try{
    await t.applyConstraints({advanced:[{focusMode:mode, pointsOfInterest:[{x,y}]}]});
  }catch(err){
    try{ await t.applyConstraints({advanced:[{focusMode:mode}]}); }catch(e2){}
  }
  if(mode==="single-shot" && modes.includes("continuous")){
    setTimeout(()=>{ if(track()===t){ t.applyConstraints({advanced:[{focusMode:"continuous"}]}).catch(()=>{}); } }, 3000);
  }
});

function onCode(code){
  const box = $("result"), g = games[code];
  box.style.display = "block";
  if(g){
    box.className = "";
    box.innerHTML = `<div class="name">${esc(g.name)}</div><div style="color:var(--mute)">${esc(g.console)}</div><div class="price">${eur(g.price)}</div>`;
    fillForm(g);
  }else{
    box.className = "unknown";
    box.innerHTML = `<div class="name">Jeu inconnu</div><div style="color:var(--mute)">Code ${esc(code)} : ajoutez-le avec le formulaire ci-dessous.</div>`;
    $("fCode").value = code; $("fName").value = ""; $("fPrice").value = "";
    $("fName").focus();
  }
  if(navigator.vibrate) navigator.vibrate(60);
}

/* ---------- Catalogue ---------- */
function fillForm(g){ $("fName").value=g.name; $("fCode").value=g.code; $("fConsole").value=g.console; $("fPrice").value=String(g.price).replace(".",","); }

$("saveBtn").addEventListener("click",()=>{
  const name = $("fName").value.trim(), code = $("fCode").value.trim().replace(/\s+/g,"");
  const price = parseFloat($("fPrice").value.replace(",","."));
  if(!name) return toast("Indiquez le nom du jeu.");
  if(!code) return toast("Indiquez le code-barres.");
  if(isNaN(price) || price < 0) return toast("Indiquez un prix valide.");
  games[code] = {name, code, console:$("fConsole").value, price};
  persist(); render();
  $("fName").value=$("fCode").value=$("fPrice").value="";
  toast("Jeu enregistré.");
});

function render(){
  const list = $("list"), groups = {};
  Object.values(games).forEach(g=>(groups[g.console] ||= []).push(g));
  const keys = Object.keys(groups).sort((a,b)=>a.localeCompare(b,"fr"));
  $("count").textContent = Object.keys(games).length ? `(${Object.keys(games).length})` : "";
  if(!keys.length){ list.innerHTML = `<p class="empty">Aucun jeu pour l'instant. Scannez un code-barres ou remplissez le formulaire.</p>`; return; }
  const open = new Set([...list.querySelectorAll("details[open]")].map(d=>d.dataset.k));
  list.innerHTML = keys.map(k=>`
    <details data-k="${esc(k)}" ${open.has(k)?"open":""}>
      <summary>${esc(k)} <span>${groups[k].length}</span></summary>
      ${groups[k].sort((a,b)=>a.name.localeCompare(b.name,"fr")).map(g=>`
        <div class="game">
          <div data-edit="${esc(g.code)}" style="cursor:pointer">${esc(g.name)}<small>${esc(g.code)}</small></div>
          <b>${eur(g.price)}</b>
          <button type="button" data-del="${esc(g.code)}" aria-label="Supprimer ${esc(g.name)}">Suppr.</button>
        </div>`).join("")}
    </details>`).join("");
}
$("list").addEventListener("click",e=>{
  const d = e.target.closest("[data-del]"), ed = e.target.closest("[data-edit]");
  if(d){ const g = games[d.dataset.del]; if(g && confirm(`Supprimer « ${g.name} » ?`)){ delete games[g.code]; persist(); render(); } }
  else if(ed){ fillForm(games[ed.dataset.edit]); $("fName").scrollIntoView({behavior:"smooth",block:"center"}); }
});

/* ---------- Sauvegarde ---------- */
$("exportBtn").addEventListener("click",()=>{
  const blob = new Blob([JSON.stringify(games,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "sauvegarde_catalogue.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("Sauvegarde exportée.");
});
$("importBtn").addEventListener("click",()=>$("importFile").click());
$("importFile").addEventListener("change",async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{
    const data = JSON.parse(await f.text());
    const items = Array.isArray(data) ? data : Object.values(data);
    let n = 0;
    items.forEach(g=>{ if(g && g.code && g.name && !isNaN(parseFloat(g.price))){ games[String(g.code)] = {name:String(g.name),code:String(g.code),console:g.console||"Autre",price:parseFloat(g.price)}; n++; } });
    persist(); render(); toast(`${n} jeu(x) importé(s).`);
  }catch(err){ toast("Fichier de sauvegarde invalide."); }
  e.target.value = "";
});

document.addEventListener("visibilitychange",()=>{ if(document.hidden && scanning) stopScan(); });
load(); render();
</script>
</body>
</html>
